# ==============================================================================
# CACOFER TECNOLOGIA — CONFIGURAÇÃO NGINX DE ALTA SEGURANÇA (HARDENED)
# Padrões: CIS Benchmarks, OWASP Top 10, TLS 1.3, Rate-Limiting & Anti-DDoS
# ==============================================================================

# 1. Zona de Rate Limiting para Proteção contra Ataques de Força Bruta e Flood
limit_req_zone $binary_remote_addr zone=cacofer_limit:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=cacofer_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name cacofer.com.br www.cacofer.com.br;

    # Redirecionamento permanente e forçado para HTTPS (Segurança HSTS)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cacofer.com.br www.cacofer.com.br;

    root /var/www/cacofer_website;
    index index.html;

    # ==========================================================================
    # CERTIFICADOS SSL & PROTOCOLOS CRIPTOGRÁFICOS MODERNOS
    # ==========================================================================
    ssl_certificate /etc/letsencrypt/live/cacofer.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cacofer.com.br/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/cacofer.com.br/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ==========================================================================
    # CABEÇALHOS DE CIBERSEGURANÇA (SECURITY HEADERS MANDATÓRIOS)
    # ==========================================================================
    # 1. HSTS (Força HTTPS estrito e impede downgrade attacks)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 2. Anti-Clickjacking
    add_header X-Frame-Options "DENY" always;

    # 3. Anti-MIME Sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # 4. Anti-XSS Filter (para navegadores legados)
    add_header X-XSS-Protection "1; mode=block" always;

    # 5. Política de Referrer Estrita
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 6. Content Security Policy (CSP Estrito - Bloqueia injeção de scripts não autorizados)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://wa.me; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://wa.me;" always;

    # 7. Permissions-Policy (Desativa microfone, câmera e sensores no navegador)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Ocultar versão do servidor Nginx
    server_tokens off;

    # ==========================================================================
    # LIMITES DE BUFFER & MITIGAÇÃO CONTRA DDOS / SLOWLORIS
    # ==========================================================================
    client_body_buffer_size 128k;
    client_max_body_size 5M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # Conexões máximas por IP
    limit_conn cacofer_conn 20;

    # ==========================================================================
    # BLOQUEIO DE ARQUIVOS OCULTOS E VARREDURAS DE VULNERABILIDADE
    # ==========================================================================
    # Bloquear acesso a arquivos ocultos (.git, .env, etc)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquear scripts PHP, ASP ou extensões executáveis caso tentem injetar
    location ~* \.(php|asp|aspx|jsp|cgi|py|sh|bash|sql)$ {
        deny all;
        return 404;
    }

    # ==========================================================================
    # COMPRESSÃO GZIP & DESEMPENHO LIGHTHOUSE
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cache estático de longa duração para CSS, JS e imagens
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        limit_req zone=cacofer_limit burst=30 nodelay;
    }

    # Roteamento principal
    location / {
        limit_req zone=cacofer_limit burst=10 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
